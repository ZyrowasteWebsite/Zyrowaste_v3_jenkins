# Load into Prometheus via rule_files or PrometheusRule CRD (kube-prometheus-stack).
groups:
  - name: swaroop-platform
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "Error rate exceeds 5% for 5 minutes."

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency (p95)"
          description: "p95 request latency exceeds 2s for 5 minutes."

      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod container restarting frequently"
          description: "Restarts increased by more than 3 within 15 minutes."

      - alert: CertificateExpiringSoon
        expr: |
          (
            certmanager_certificate_expiration_timestamp_seconds - time()
          ) > 0
          and
          (
            certmanager_certificate_expiration_timestamp_seconds - time()
          ) < (90 * 24 * 3600)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expiring within 90 days"
          description: "Certificate expires in fewer than 90 days (cert-manager metric)."
