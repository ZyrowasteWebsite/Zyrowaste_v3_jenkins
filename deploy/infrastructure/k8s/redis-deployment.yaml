apiVersion: apps/v1
kind: Deployment
metadata:
  name: swaroop-redis
  namespace: swaroop
  labels:
    app: swaroop-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swaroop-redis
  template:
    metadata:
      labels:
        app: swaroop-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: swaroop-redis
  namespace: swaroop
  labels:
    app: swaroop-redis
spec:
  type: ClusterIP
  selector:
    app: swaroop-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
