# Production stack for Zyrowaste (zyrowaste.com)
# Deployed by Jenkins via scripts/jenkins/deploy.sh
# Zero-downtime: rolling recreate + healthchecks before traffic switch

services:
  frontend:
    image: ${FRONTEND_IMAGE:-zyrowaste-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - zyrowaste
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
    labels:
      - "app=zyrowaste"
      - "tier=frontend"

  backend:
    image: ${BACKEND_IMAGE:-zyrowaste-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_PERSIST_DIR: /data/chroma
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-https://zyrowaste.com,https://www.zyrowaste.com}
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - zyrowaste
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 60s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 15s
    labels:
      - "app=zyrowaste"
      - "tier=backend"

  chromadb:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - zyrowaste

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zyrowaste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zyrowaste}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zyrowaste
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zyrowaste} -d ${POSTGRES_DB:-zyrowaste}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed publicly — only on internal network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - zyrowaste
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Edge reverse proxy — TLS termination for zyrowaste.com
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/zyrowaste.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - zyrowaste
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./infrastructure/nginx/ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles:
      - certs
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

networks:
  zyrowaste:
    driver: bridge
    name: zyrowaste_net

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  certbot_www:
