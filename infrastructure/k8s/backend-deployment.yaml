apiVersion: apps/v1
kind: Deployment
metadata:
  name: swaroop-backend
  namespace: swaroop
  labels:
    app: swaroop-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swaroop-backend
  template:
    metadata:
      labels:
        app: swaroop-backend
    spec:
      containers:
        - name: backend
          image: swaroop/backend:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: swaroop-config
            - secretRef:
                name: swaroop-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: swaroop-backend
  namespace: swaroop
  labels:
    app: swaroop-backend
spec:
  type: ClusterIP
  selector:
    app: swaroop-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
