apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: swaroop-backend-hpa
  namespace: swaroop
  labels:
    app: swaroop-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: swaroop-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
