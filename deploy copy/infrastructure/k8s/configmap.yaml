apiVersion: v1
kind: ConfigMap
metadata:
  name: swaroop-config
  namespace: swaroop
  labels:
    app: swaroop-formulation
data:
  CHROMA_PERSIST_DIR: /data/chroma
  EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  LLM_MODEL: llama-3.3-70b-versatile
  CORS_ORIGINS: https://swaroop.in
  DATABASE_URL: postgresql://swaroop:changeme@postgres-svc:5432/swaroop
