apiVersion: apps/v1
kind: Deployment
metadata:
  name: swaroop-frontend
  namespace: swaroop
  labels:
    app: swaroop-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swaroop-frontend
  template:
    metadata:
      labels:
        app: swaroop-frontend
    spec:
      containers:
        - name: frontend
          image: swaroop/frontend:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: swaroop-frontend
  namespace: swaroop
  labels:
    app: swaroop-frontend
spec:
  type: ClusterIP
  selector:
    app: swaroop-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
